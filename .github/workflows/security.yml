name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL à auditer (headers HTTP / CSP)"
        required: false
        default: ""
  schedule:
    # Audit quotidien du site publié (05:30 UTC)
    - cron: "30 5 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Headers, CSP & endpoints exposés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit statique (code, endpoints publics, politique CSP)
        run: bun run security:check

      - name: Audit du site déployé (en-têtes HTTP réels)
        env:
          # Reste sur le site actuellement en ligne tant que vars.SECURITY_TARGET_URL
          # n'a pas été basculé sur https://africpub.tech (après déploiement VPS + DNS).
          TARGET_URL: ${{ github.event.inputs.target_url || vars.SECURITY_TARGET_URL || 'https://premium-afric-vision.lovable.app' }}
        run: bun run security:check -- --url "$TARGET_URL"

      - name: Audit des dépendances
        run: bun audit --audit-level=high || echo "::warning::Vulnérabilités de dépendances détectées"

  csp-e2e:
    name: Tests E2E CSP (Playwright)
    runs-on: ubuntu-latest
    # Clé Supabase "publishable" : conçue pour être publique (protégée par RLS côté
    # base), nécessaire au build et au SSR pour que les pages de données répondent
    # 200 pendant les tests. Ne jamais mettre ici une clé service_role/secrète.
    env:
      SUPABASE_PROJECT_ID: ztddotfrmpvgwqlkculj
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_lErVHi67TBOytUm2wfxdcg_noQwJxYf
      SUPABASE_URL: https://ztddotfrmpvgwqlkculj.supabase.co
      VITE_SUPABASE_PROJECT_ID: ztddotfrmpvgwqlkculj
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lErVHi67TBOytUm2wfxdcg_noQwJxYf
      VITE_SUPABASE_URL: https://ztddotfrmpvgwqlkculj.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build de production
        run: bun run build

      - name: Tests CSP sur les routes publiques
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
